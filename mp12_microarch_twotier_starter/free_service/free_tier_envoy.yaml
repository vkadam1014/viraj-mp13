# Starter Envoy proxy configuration for the Free Tier service.
#
# This YAML configures Envoy to proxy HTTP requests to the Flask API running
# on free-tier-service. Students may use this as a base for adding routing, filters,
# or other proxy features as needed.
#
# TODO: Fill in the Envoy proxy configuration here.

apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
  namespace: free-service

data:
  envoy.yaml: |
    static_resources:
      listeners:
      - name: listener_0
        address:
          socket_address:
            address: 0.0.0.0
            port_value: 10000

        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager

              stat_prefix: ingress_http

              route_config:
                name: local_route

                virtual_hosts:
                - name: backend
                  domains: ["*"]

                  routes:
                  - match:
                      prefix: "/"
                    route:
                      cluster: flask_service

              http_filters:
              - name: envoy.filters.http.router

      clusters:
      - name: flask_service
        connect_timeout: 0.25s
        type: logical_dns
        lb_policy: round_robin

        load_assignment:
          cluster_name: flask_service

          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: 5000

    admin:
      access_log_path: /tmp/admin_access.log
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901