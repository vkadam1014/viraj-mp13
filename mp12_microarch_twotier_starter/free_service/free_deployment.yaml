# Starter Kubernetes Deployment for the Free Tier service.
#
# This YAML defines a deployment that runs both the Flask API and Envoy proxy
# in the 'free-service' namespace. 
#
# TODO: Fill in the Kubernetes Deployment spec here.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: free-tier-deployment
  namespace: free-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: free-tier-app
  template:
    metadata:
      labels:
        app: free-tier-app
    spec:
      containers:
      - name: flask-api
        image: vkadam157/free-tier-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "250m"
            memory: "128Mi"
      - name: envoy-proxy
        image: envoyproxy/envoy:v1.18-latest
        imagePullPolicy: Always
        ports:
        - containerPort: 9901
        - containerPort: 10000
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "250m"
            memory: "128Mi"
        command: ["/usr/local/bin/envoy", "-c", "/etc/envoy/envoy.yaml"]
        args: ["--service-node", "free-tier-node", "--service-cluster", "free-tier-cluster"]
        volumeMounts:
        - name: envoy-config
          mountPath: /etc/envoy
      volumes:
      - name: envoy-config
        configMap:
          name: envoy-config

        