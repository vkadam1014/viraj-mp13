# Starter Kubernetes Deployment for the Premium Tier service.
#
# This YAML defines a deployment that runs both the Flask API and Envoy proxy
# in the 'premium-service' namespace. 
#
# TODO: Fill in the Kubernetes Deployment spec here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: premium-tier-deployment
  namespace: premium-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: premium-tier-app
  template:
    metadata:
      labels:
        app: premium-tier-app
    spec:
      containers:
      - name: flask-api
        image: virajk063/premium-tier-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000

      - name: envoy-proxy
        image: envoyproxy/envoy:v1.18-latest
        imagePullPolicy: Always
        ports:
        - containerPort: 9901
        - containerPort: 10000
        command: ["/usr/local/bin/envoy"]
        args:
          - "-c"
          - "/etc/envoy/envoy.yaml"
          - "--service-node"
          - "premium-tier-node"
          - "--service-cluster"
          - "premium-tier-cluster"
        volumeMounts:
        - name: envoy-config
          mountPath: /etc/envoy

      volumes:
      - name: envoy-config
        configMap:
          name: envoy-config-premium